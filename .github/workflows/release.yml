name: Stage release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit
    permissions:
      contents: read

  draft:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: TextPicker-${{ github.sha }}
          path: artifacts
      - name: Verify release candidate and prepare reviewed metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          python3 -B scripts/release_archive.py --check-tag "$RELEASE_TAG"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          config = json.loads(Path(".github/release.json").read_text())
          candidate = json.loads(Path("artifacts/release-metadata.json").read_text())
          assert candidate["tag"] == os.environ["RELEASE_TAG"] == config["tag"]
          assert candidate["commit"] == os.environ["RELEASE_COMMIT"]
          assert candidate["architecture"] == "arm64"
          assert candidate["signing"] == config["signing"] == "self-signed"
          assert candidate["certificate_sha256"] == config["certificate_sha256"]
          assert candidate["notarized"] is False
          expected = {"SHA256SUMS.txt", "release-metadata.json", "TextPicker-arm64.zip"}
          assert {p.name for p in Path("artifacts").iterdir()} == expected
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("RELEASE_TITLE=" + config["title"] + "\n")
          PY
          (cd artifacts && sha256sum --check --strict SHA256SUMS.txt)
      - name: Create a draft release; the owner publishes it
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A release already exists for this tag; refusing to replace it." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "$RELEASE_TITLE" --notes-file .github/RELEASE.md artifacts/*
