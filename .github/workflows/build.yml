name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      BUILD_JOBS: "3"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select supported Apple Silicon toolchain
        run: |
          test "$(uname -m)" = arm64
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          sw_vers
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: scripts/requirements-dev.txt
      - name: Set up development tools
        run: bash scripts/setup.sh
      - name: Cache checksum-pinned model pack
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/downloads
          key: native-models-${{ hashFiles('native/models/distribution.json', 'native/models/manifest.json') }}
      - name: Cache dependency downloads, never extracted source or binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/deps/opencv-5.0.0.tar.gz
            .build/deps/clipper.cpp
            .build/deps/clipper.hpp
            .build/deps/opencv-cache/kleidicv/*.tar.gz
          key: native-dependencies-${{ hashFiles('native/dependencies.json') }}
      - name: Check tagged release metadata
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: .venv/bin/python -B scripts/release_archive.py --check-tag "$RELEASE_TAG"
      - name: Build and run the complete automated suite
        run: |
          mkdir -p .build/reports
          set -o pipefail
          bash scripts/test.sh 2>&1 | tee .build/reports/ci.log
      - name: Archive the exact qualified app
        run: .venv/bin/python -B scripts/release_archive.py
      - name: Upload release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TextPicker-${{ github.sha }}
          path: .build/dist/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Upload qualification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualification-${{ github.sha }}
          path: .build/reports/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
